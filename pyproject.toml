[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-phobosstream"
version = "0.4.0"
description = "Zero-VRAM Video & Image Diffusion Streaming & 3-Stage Offloading Extension for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martian Academy", email = "research@martian.academy" }]
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "pydantic>=2.7.0",
]

[project.urls]
Repository = "https://github.com/martianacademy/ComfyUI-PhobosStream"

[tool.hatch.build.targets.wheel]
packages = ["phobos_stream"]

[tool.comfy]
PublisherId = "martianacademy"
DisplayName = "ComfyUI-PhobosStream"
Icon = "https://raw.githubusercontent.com/martianacademy/ComfyUI-PhobosStream/main/assets/icon.png?v=2"
